# Umbrales y parámetros del bot. Los secretos (webhooks, tokens, coordenadas de la oficina)
# van en .env en local y en GitHub Secrets en Actions.
user_agent: "brno-pisos/0.1 (+https://github.com/pallerdev/brno-pisos)"

departure:
  time: "08:00"
  tz: "Europe/Prague"

destinations:
  work:
    env: WORK_LATLON        # en secreto: el repo es público
    label: "oficina"
  station:
    lat: 49.1906
    lon: 16.6127
    label: "hlavní nádraží"

landmarks:
  luzanky:
    lat: 49.2068
    lon: 16.6083
    radius_m: 1000

supermarket:
  max_straight_m: 640       # ≈ 10 min andando con factor de rodeo 1,3
  bbox: [49.10, 16.45, 49.30, 16.75]
  refresh_days: 7

energy_estimates:           # CZK/mes, cifras a ojo; ajustar con la experiencia
  room: 800
  "1+kk": 1000
  "1+1": 1000
  "2+kk": 1500
  "2+1": 1500
  "3+kk": 2000
  "3+1": 2500
  "4+kk": 2500
  "4+1": 3000
  "5+kk": 3000
  default: 2500

profiles:
  yo:
    webhook_env: DISCORD_WEBHOOK_YO
    kinds: [room, flat]
    max_total: 10000
    star_total: 8000
    destination: work
    transit:
      max_minutes: 30
      direct:
        modes: [TRAM]
        max_minutes: 40
        max_walk_minutes: 10
  grupo:
    webhook_env: DISCORD_WEBHOOK_GRUPO
    kinds: [flat]
    people: [3, 4]
    per_person_ok: 11000
    per_person_max: 12000
    destination: station
    transit:
      max_minutes: 30

digest:
  hour: 19

run:
  budget_seconds: 420        # al agotarse no se empieza trabajo nuevo; el paso de Actions se corta a los 8 min

llm:
  model: "gemini-3.5-flash-lite"
  daily_limit: 200           # tope del bot; la cuota del proyecto se consulta en Google AI Studio

collectors:
  bazos_psc_prefixes: ["60", "61", "62", "63", "64"]
  failure_alert_after: 3
